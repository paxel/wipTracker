# Fails only when a dependency has a known vulnerability (RustSec advisories). Runs weekly and
# on demand, because new advisories appear without any change in this repo.
# Warnings such as unmaintained or yanked packages are reported but never fail it.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Vulnerable crates (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
