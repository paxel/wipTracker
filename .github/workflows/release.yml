# Release on tag: `git tag v0.1.0 && git push --tags` produces everything.
#
#   gate          — the full Linux gate once more (fmt, clippy, all tests)
#   build-linux   — tar.gz (binary, icon, .desktop, install script) and a .deb
#   build-windows — zip with wiptracker.exe and the Start-menu shortcut script
#   build-macos   — per-arch binary tar.gz (what Homebrew installs) plus one universal
#                   unsigned WipTracker.app in a .dmg (what people download by hand)
#   release       — GitHub Release, notes = the CHANGELOG section for the tag; every
#                   file gets a build provenance attestation, plus a source SBOM
#   channels      — Homebrew formula + Scoop manifest pushed to the tap/bucket
#
# One-time setup (repository secrets):
#   CHANNEL_PAT — PAT with push access to paxel/homebrew-tap and paxel/scoop-bucket
name: Release

on:
  push:
    tags: ["v*"]
  # A manual re-run for a tag that already exists — the way back when a release job fails
  # for a reason that has since been fixed, without moving or burning a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Least privilege: the job that writes the GitHub Release widens this itself.
permissions:
  contents: read

jobs:
  gate:
    name: Gate (Linux, full)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read # the code-scanning alert check below
    steps:
      # The full history, so the code-scanning step finds the branches that hold the
      # tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      # Exits 1 on any finding, unmaintained notices too; the next step decides.
      - name: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --recursive
            ./
      - name: No known vulnerability (unmaintained notices reported only)
        run: python3 tool/osv_gate.py osv-results.json
      # The release notes are this section; a release without one stops here, before
      # anything is built.
      - name: CHANGELOG.md has a section for this version
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab && NF { found = 1 }
            END { exit !found }
          ' CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $ver" >&2; exit 1; }
      # Code scanning analyses branches, not tags: every open alert on a branch that holds
      # this commit counts, from every tool (CodeQL, Scorecard) and of every severity.
      # tool/code_scanning_gate.py fails on each one that code-scanning-ignores.toml does
      # not accept with a reason and a date. A branch never analysed is skipped; none
      # analysed at all stops the release too.
      - name: No open code-scanning alert that is not accepted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          branches=$(git branch -r --contains "$sha" --format='%(refname:lstrip=3)' | grep -vx HEAD || true)
          analysed=0
          : > "$RUNNER_TEMP/alerts.jsonl"
          for b in $branches; do
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=refs/heads/$b&state=open&per_page=100" \
              --jq '.[]' >> "$RUNNER_TEMP/alerts.jsonl" 2> "$RUNNER_TEMP/error.txt"; then
              if grep -q 'no analysis found' "$RUNNER_TEMP/error.txt"; then
                echo "$b: not analysed, skipped"
                continue
              fi
              cat "$RUNNER_TEMP/error.txt" >&2
              exit 1
            fi
            analysed=$((analysed + 1))
          done
          [ "$analysed" -gt 0 ] || { echo "no code-scanning analysis on any branch that holds $sha" >&2; exit 1; }
          python3 tool/code_scanning_gate.py "$RUNNER_TEMP/alerts.jsonl" code-scanning-ignores.toml
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libvulkan1 mesa-vulkan-drivers desktop-file-utils libxss-dev \
            xvfb xauth openbox xautomation libxkbcommon-x11-0
      - name: Tag matches the crate version
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${RELEASE_TAG#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # Under Xvfb with openbox, as in CI: the X11 desktop tests fail without a session.
      - run: xvfb-run -a -s '-screen 0 1920x1600x24' sh -c 'openbox & sleep 2; cargo test --locked --all-features'
      - name: Coverage ratchet
        run: |
          cargo install cargo-tarpaulin --locked --version 0.37.6
          scripts/coverage.sh --check
      # The same packaging checks CI runs: a broken entry would otherwise only surface
      # once the .deb had installed it on someone's machine.
      - run: desktop-file-validate packaging/wiptracker.desktop
      - run: sh -n packaging/install-icon.sh && bash -n packaging/mkdeb.sh && bash -n packaging/mkapp.sh

  build-linux:
    name: Linux artifacts
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config dpkg-dev \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libxss-dev
      - name: Build release binary
        run: cargo build --locked --release
      - name: Tarball with the desktop files
        # The icon, the .desktop entry and the install script travel with the binary:
        # Wayland shows no icon without them, and Homebrew on Linux installs this tarball.
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p dist stage
          cp target/release/wiptracker stage/
          cp assets/icon.png assets/icon-*.png packaging/wiptracker.desktop \
            packaging/install-icon.sh stage/
          cp README.md LICENSE-MIT LICENSE-APACHE stage/
          tar -C stage -czf "dist/wiptracker-${ver}-linux-x86_64.tar.gz" .
      - name: Debian package
        run: packaging/mkdeb.sh --no-build --version "${RELEASE_TAG#v}" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*

  build-windows:
    name: Windows artifacts
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build --locked --release
      - name: Zip
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/wiptracker.exe, `
                                 packaging/install-shortcut.ps1, `
                                 LICENSE-MIT, `
                                 LICENSE-APACHE `
                           -DestinationPath "dist/wiptracker-$ver-windows-x86_64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  build-macos:
    name: macOS artifacts
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
      - name: Both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binaries
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Per-architecture tarballs (Homebrew installs these)
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p dist
          tar -C target/aarch64-apple-darwin/release \
            -czf "dist/wiptracker-${ver}-macos-arm64.tar.gz" wiptracker
          tar -C target/x86_64-apple-darwin/release \
            -czf "dist/wiptracker-${ver}-macos-x86_64.tar.gz" wiptracker
      - name: Universal app bundle in a dmg (for hand-downloads)
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p build
          lipo -create -output build/wiptracker \
            target/aarch64-apple-darwin/release/wiptracker \
            target/x86_64-apple-darwin/release/wiptracker
          packaging/mkapp.sh build/wiptracker "$ver" dist universal
          rm -rf dist/WipTracker.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*

  release:
    name: GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # signs the provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      # Before the artifacts land in the workspace, so the SBOM covers the source tree
      # only: Cargo.lock, which is what the binaries contain.
      - name: Source SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: wiptracker-${{ env.RELEASE_TAG }}-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SBOM next to the artifacts
        run: mv "wiptracker-${RELEASE_TAG}-source.cdx.json" dist/
      # Signed provenance per file: `gh attestation verify <file> -R paxel/wipTracker`.
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $ver" >&2; exit 1; }
      # softprops updates an existing release rather than failing on it: publishing from
      # the GitHub UI creates the tag, which starts this workflow, so the release usually
      # exists before the artifacts are built. The body always comes from CHANGELOG.md, so
      # the release notes and the file cannot drift apart.
      - name: Create or update the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WipTracker ${{ env.RELEASE_TAG }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

  channels:
    name: Homebrew tap + Scoop bucket
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Render formula and manifest from the templates
        run: |
          ver=${RELEASE_TAG#v}
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          mkdir -p out
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_MACOS_ARM64}}/$(sha wiptracker-$ver-macos-arm64.tar.gz)/" \
              -e "s/{{SHA_MACOS_X86_64}}/$(sha wiptracker-$ver-macos-x86_64.tar.gz)/" \
              -e "s/{{SHA_LINUX_X86_64}}/$(sha wiptracker-$ver-linux-x86_64.tar.gz)/" \
              packaging/homebrew/wiptracker.rb.tmpl > out/wiptracker.rb
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_WINDOWS_X86_64}}/$(sha wiptracker-$ver-windows-x86_64.zip)/" \
              packaging/scoop/wiptracker.json.tmpl > out/wiptracker.json
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git config --global user.name "wiptracker-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/wiptracker.rb tap/Formula/wiptracker.rb
          git -C tap add Formula/wiptracker.rb
          git -C tap commit -m "wiptracker $ver"
          git -C tap push
      - name: Push to the bucket
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/wiptracker.json bucket/bucket/wiptracker.json
          git -C bucket add bucket/wiptracker.json
          git -C bucket commit -m "wiptracker $ver"
          git -C bucket push
