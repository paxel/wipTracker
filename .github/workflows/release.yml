name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Build (Linux)
        if: matrix.name == 'linux-x86_64'
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package (Linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          mkdir -p dist
          tar -czf dist/wiptracker-${{ github.ref_name }}-linux-x86_64.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release wiptracker
          cp README.md LICENSE-MIT LICENSE-APACHE dist/ || true

      - name: Build (Windows)
        if: matrix.name == 'windows-x86_64'
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target\x86_64-pc-windows-msvc\release\wiptracker.exe `
            -DestinationPath dist\wiptracker-${{ github.ref_name }}-windows-x86_64.zip

      - name: Build (macOS universal)
        if: matrix.name == 'macos-universal'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package (macOS app bundle)
        if: matrix.name == 'macos-universal'
        run: |
          set -euo pipefail
          APP="dist/WipTracker.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/wiptracker" \
            target/aarch64-apple-darwin/release/wiptracker \
            target/x86_64-apple-darwin/release/wiptracker
          chmod +x "$APP/Contents/MacOS/wiptracker"
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>WipTracker</string>
            <key>CFBundleDisplayName</key><string>WipTracker</string>
            <key>CFBundleIdentifier</key><string>de.paxel.wiptracker</string>
            <key>CFBundleExecutable</key><string>wiptracker</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          PLIST
          cd dist
          zip -qry "wiptracker-${GITHUB_REF_NAME}-macos-universal.zip" WipTracker.app
          rm -rf WipTracker.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: ignore

      - name: Upload Linux tarball
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/*.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
