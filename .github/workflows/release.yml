# Release on tag: `git tag v0.1.0 && git push --tags` produces everything.
#
#   gate          — the full Linux gate once more (fmt, clippy, all tests)
#   build-linux   — tar.gz (binary, icon, .desktop, install script) and a .deb
#   build-windows — zip with wiptracker.exe and the Start-menu shortcut script
#   build-macos   — per-arch binary tar.gz (what Homebrew installs) plus one universal
#                   unsigned WipTracker.app in a .dmg (what people download by hand)
#   release       — GitHub Release, notes = the CHANGELOG section for the tag
#   channels      — Homebrew formula + Scoop manifest pushed to the tap/bucket
#
# One-time setup (repository secrets):
#   CHANNEL_PAT — PAT with push access to paxel/homebrew-tap and paxel/scoop-bucket
name: Release

on:
  push:
    tags: ["v*"]
  # A manual re-run for a tag that already exists — the way back when a release job fails
  # for a reason that has since been fixed, without moving or burning a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  gate:
    name: Gate (Linux, full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libvulkan1 mesa-vulkan-drivers desktop-file-utils
      - name: Tag matches the crate version
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${RELEASE_TAG#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Coverage ratchet
        run: |
          cargo install cargo-tarpaulin --locked
          scripts/coverage.sh --check
      # The same packaging checks CI runs: a broken entry would otherwise only surface
      # once the .deb had installed it on someone's machine.
      - run: desktop-file-validate packaging/wiptracker.desktop
      - run: sh -n packaging/install-icon.sh && bash -n packaging/mkdeb.sh && bash -n packaging/mkapp.sh

  build-linux:
    name: Linux artifacts
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config dpkg-dev \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build release binary
        run: cargo build --release
      - name: Tarball with the desktop files
        # The icon, the .desktop entry and the install script travel with the binary:
        # Wayland shows no icon without them, and Homebrew on Linux installs this tarball.
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p dist stage
          cp target/release/wiptracker stage/
          cp assets/icon.png assets/icon-*.png packaging/wiptracker.desktop \
            packaging/install-icon.sh stage/
          cp README.md LICENSE-MIT LICENSE-APACHE stage/
          tar -C stage -czf "dist/wiptracker-${ver}-linux-x86_64.tar.gz" .
      - name: Debian package
        run: packaging/mkdeb.sh --no-build --version "${RELEASE_TAG#v}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  build-windows:
    name: Windows artifacts
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Zip
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/wiptracker.exe, `
                                 packaging/install-shortcut.ps1, `
                                 LICENSE-MIT, `
                                 LICENSE-APACHE `
                           -DestinationPath "dist/wiptracker-$ver-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  build-macos:
    name: macOS artifacts
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Per-architecture tarballs (Homebrew installs these)
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p dist
          tar -C target/aarch64-apple-darwin/release \
            -czf "dist/wiptracker-${ver}-macos-arm64.tar.gz" wiptracker
          tar -C target/x86_64-apple-darwin/release \
            -czf "dist/wiptracker-${ver}-macos-x86_64.tar.gz" wiptracker
      - name: Universal app bundle in a dmg (for hand-downloads)
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p build
          lipo -create -output build/wiptracker \
            target/aarch64-apple-darwin/release/wiptracker \
            target/x86_64-apple-darwin/release/wiptracker
          packaging/mkapp.sh build/wiptracker "$ver" dist universal
          rm -rf dist/WipTracker.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    name: GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      # softprops updates an existing release rather than failing on it: publishing from
      # the GitHub UI creates the tag, which starts this workflow, so the release usually
      # exists before the artifacts are built. The body always comes from CHANGELOG.md, so
      # the release notes and the file cannot drift apart.
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WipTracker ${{ env.RELEASE_TAG }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

  channels:
    name: Homebrew tap + Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render formula and manifest from the templates
        run: |
          ver=${RELEASE_TAG#v}
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          mkdir -p out
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_MACOS_ARM64}}/$(sha wiptracker-$ver-macos-arm64.tar.gz)/" \
              -e "s/{{SHA_MACOS_X86_64}}/$(sha wiptracker-$ver-macos-x86_64.tar.gz)/" \
              -e "s/{{SHA_LINUX_X86_64}}/$(sha wiptracker-$ver-linux-x86_64.tar.gz)/" \
              packaging/homebrew/wiptracker.rb.tmpl > out/wiptracker.rb
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_WINDOWS_X86_64}}/$(sha wiptracker-$ver-windows-x86_64.zip)/" \
              packaging/scoop/wiptracker.json.tmpl > out/wiptracker.json
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git config --global user.name "wiptracker-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/wiptracker.rb tap/Formula/wiptracker.rb
          git -C tap add Formula/wiptracker.rb
          git -C tap commit -m "wiptracker $ver"
          git -C tap push
      - name: Push to the bucket
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/wiptracker.json bucket/bucket/wiptracker.json
          git -C bucket add bucket/wiptracker.json
          git -C bucket commit -m "wiptracker $ver"
          git -C bucket push
