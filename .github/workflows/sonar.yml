# SonarQube Cloud analysis of summer after each merge; the free plan analyses the main
# branch only. Report only: the quality gate shows on
# https://sonarcloud.io/summary/new_code?id=paxel_wipTracker and fails no build. What is
# analysed is in sonar-project.properties.
name: SonarQube Cloud

on:
  push:
    branches: [summer]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-24.04
    steps:
      # The full history, for the blame and the new-code period.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libvulkan1 mesa-vulkan-drivers libxss-dev

      # Imported by the analyzer as external issues.
      - name: Clippy report for the analyzer
        run: |
          mkdir -p build
          cargo clippy --locked --all-targets --all-features --message-format=json > build/clippy-report.json

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-tarpaulin

      # The LCOV file sonar-project.properties names, from the same script as the
      # coverage ratchet. Report only, like the analysis: a run below the floor still
      # writes the file.
      - name: Coverage (LCOV for the analyzer)
        continue-on-error: true
        run: scripts/coverage.sh --check

      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SQ_TOKEN }}
