name: Fuzz

# The fuzz targets in fuzz/ (cargo-fuzz, libFuzzer), weekly and by hand, from paxel/gates: the
# clock times a person types, and the store file read at start, damaged in every way libFuzzer
# finds. A crash fails the job; `cargo fuzz run <target> <file>` replays its input.
#
# cargo-fuzz needs nightly compiler flags. The shared workflow gives them to the pinned stable
# toolchain through RUSTC_BOOTSTRAP=1, so the code is fuzzed with the compiler that builds the
# release.
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@ba23cabf3ca13ea19f2100ba319869768209a7ce # v1.1.2
    with:
      stack: rust
      apt-packages: >-
        libasound2-dev pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev
        libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libxss-dev
      targets: |
        parse_clock
        store_load
