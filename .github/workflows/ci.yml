name: CI

on:
  # Every branch, not just main: the work happens on topic branches, and the gate is only
  # useful if it runs where the commits land. Tags are excluded — the release workflow
  # runs the same fmt/clippy/test gate before it builds anything, so a tag would otherwise
  # pay for it twice.
  #
  # Naming branches is what excludes the tags. A `tags-ignore` on its own does not: when
  # only tag filters are given, GitHub runs the workflow for tags alone and skips branch
  # pushes entirely — which is how this silently stopped running on every push.
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libvulkan1 mesa-vulkan-drivers \
            desktop-file-utils

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate the desktop entry and the install scripts
        # A typo here is invisible until a desktop silently ignores the entry, or a user
        # runs the installer from the tarball and it breaks halfway through.
        run: |
          desktop-file-validate packaging/wiptracker.desktop
          sh -n packaging/install-icon.sh
          bash -n packaging/mkdeb.sh
          bash -n packaging/mkapp.sh

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        # The render tests need a Vulkan device; lavapipe from mesa-vulkan-drivers
        # provides a software one on the runner.
        run: cargo test --all-features
