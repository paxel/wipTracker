name: CI

on:
  # Every branch, not just main: the work happens on topic branches, and the gate is only
  # useful if it runs where the commits land. Tags are excluded — the release workflow
  # runs the same fmt/clippy/test gate before it builds anything, so a tag would otherwise
  # pay for it twice.
  #
  # Naming branches is what excludes the tags. A `tags-ignore` on its own does not: when
  # only tag filters are given, GitHub runs the workflow for tags alone and skips branch
  # pushes entirely — which is how this silently stopped running on every push.
  push:
    branches: ["**"]
  pull_request:

# A newer push or pull request update cancels the older run of the same branch: head_ref
# is the bare branch on pull request events, ref_name on pushes, so a push to a branch
# with an open pull request shares one group instead of running the gate twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The token only reads the code: no job here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libvulkan1 mesa-vulkan-drivers \
            desktop-file-utils libxss-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate the desktop entry and the install scripts
        # A typo here is invisible until a desktop silently ignores the entry, or a user
        # runs the installer from the tarball and it breaks halfway through.
        run: |
          desktop-file-validate packaging/wiptracker.desktop
          sh -n packaging/install-icon.sh
          bash -n packaging/mkdeb.sh
          bash -n packaging/mkapp.sh

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        # The render tests need a Vulkan device; lavapipe from mesa-vulkan-drivers
        # provides a software one on the runner. The Linux jobs stay on ubuntu-24.04:
        # lavapipe on ubuntu-26.04 crashes the render tests with SIGSEGV.
        run: cargo test --locked --all-features

  cross:
    # Ubuntu alone used to be the whole gate, so anything platform-specific — a unix-only
    # API, a path assumption — compiled here and only broke once a tag reached the release
    # workflow. This builds the other two targets on every push instead.
    #
    # Clippy rather than the test suite: `--all-targets` still compiles the tests, and the
    # render tests want a GPU that these runners do not reliably have.
    name: compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  coverage:
    # The ratchet: line coverage may only go up. The floor lives in .coverage-floor; a
    # change that lowers coverage fails here, and a change that raises it is expected to
    # raise the floor in the same commit (scripts/coverage.sh does that when run locally).
    name: coverage ratchet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libvulkan1 mesa-vulkan-drivers libxss-dev

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-tarpaulin

      - name: Enforce the floor
        run: scripts/coverage.sh --check

  tools:
    name: Tools (Python unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OSV gate and code-scanning gate
        working-directory: tool
        run: python3 -m unittest test_osv_gate test_code_scanning_gate

  # Known vulnerabilities in Cargo.lock fail every push. A notice that a crate is
  # unmaintained is listed but does not fail; tool/osv_gate.py decides. Ignores live in
  # osv-scanner.toml. The weekly Security run stays stricter.
  osv-scanner:
    name: Vulnerable dependencies (OSV-Scanner)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exits 1 on any finding, unmaintained notices too; the next step decides from the
      # results, and fails when there are none.
      - name: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --recursive
            ./
      - name: No known vulnerability (unmaintained notices reported only)
        run: python3 tool/osv_gate.py osv-results.json
