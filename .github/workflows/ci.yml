name: CI

# wipTracker's gates. The standard's part comes from paxel/gates: the OSV gate, the Rust gate
# on Linux (format, lint set, clippy, tests, coverage ratchet) with a clippy build on Windows
# and macOS, and SonarQube Cloud. The packaging check is wipTracker's own
# (docs/adr/0002-move-to-gates.md).
# A branch gets its run through its pull request; a run per push as well would be the same
# jobs twice, and SonarQube Cloud analyses only the default branch and pull requests.
on:
  push:
    branches: [summer]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  vulns:
    uses: paxel/gates/.github/workflows/vulns.yml@ba23cabf3ca13ea19f2100ba319869768209a7ce # v1.1.2

  rust:
    uses: paxel/gates/.github/workflows/rust.yml@ba23cabf3ca13ea19f2100ba319869768209a7ce # v1.1.2
    with:
      # What eframe, the beeper and the idle probe link against; lavapipe from
      # mesa-vulkan-drivers is the software Vulkan device of the render tests; Xvfb, openbox
      # and xte (xautomation) are the session of the X11 desktop tests. The Linux jobs stay on
      # ubuntu-24.04, which the shared gate uses: lavapipe on ubuntu-26.04 crashes the render
      # tests with SIGSEGV.
      apt-packages: >-
        libasound2-dev pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev
        libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libvulkan1 mesa-vulkan-drivers libxss-dev
        xvfb xauth openbox xautomation libxkbcommon-x11-0
      # The X11 desktop tests need a session and fail without one.
      test-wrapper: scripts/with-desktop.sh
      # Every test target but x11_desktop: the desktop tests sit the measurement out
      # (coverage-floors.toml). A new file in tests/ is added here.
      coverage: >-
        rust --workspace --lib --bins
        --test bar_interaction --test bar_render --test cli --test hidden_bar --test journal
        --test palette_render --test persistence --test windows_smoke
      also-on: '["windows-latest", "macos-latest"]'

  packaging:
    # A typo here is invisible until a desktop silently ignores the entry, or a user runs the
    # installer from the tarball and it breaks halfway through.
    name: Desktop entry and install scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: desktop-file-validate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate packaging/wiptracker.desktop
      - name: Shell syntax of the install scripts
        run: |
          sh -n packaging/install-icon.sh
          sh -n scripts/with-desktop.sh
          bash -n packaging/mkdeb.sh
          bash -n packaging/mkapp.sh

  sonar:
    needs: rust
    uses: paxel/gates/.github/workflows/sonar.yml@ba23cabf3ca13ea19f2100ba319869768209a7ce # v1.1.2
    secrets:
      sonar-token: ${{ secrets.SQ_TOKEN }}
