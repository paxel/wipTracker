# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_wipTracker
# Analysed by .github/workflows/sonar.yml on pushes to summer; Automatic Analysis is off
# in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_wipTracker
sonar.projectName=wipTracker

# The app's code; the unit tests inside src/ are analysed with it. The Python tool in
# tool/ has no coverage report and stays out.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Clippy: the workflow writes this report with cargo clippy --message-format=json; the
# analyzer imports it as external issues.
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage: scripts/coverage.sh writes this LCOV file.
sonar.rust.lcov.reportPaths=lcov.info
