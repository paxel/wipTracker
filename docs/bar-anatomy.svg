<svg xmlns="http://www.w3.org/2000/svg" width="652" height="200" viewBox="0 0 652 200" role="img" aria-label="Anatomy of the WipTracker bar">
  <title>Anatomy of the WipTracker bar</title>

  <!-- The bar itself, drawn at twice its real size of 304 by 32 logical points. -->
  <g transform="translate(22, 16)">
    <rect x="0" y="0" width="608" height="64" rx="2" fill="#1c2028" stroke="#555f70" stroke-width="2" />

    <!-- drag handle: two columns of dots, x 12 to 32 -->
    <g fill="#9aa3b2">
      <circle cx="18" cy="20" r="1.8" /><circle cx="26" cy="20" r="1.8" />
      <circle cx="18" cy="28" r="1.8" /><circle cx="26" cy="28" r="1.8" />
      <circle cx="18" cy="36" r="1.8" /><circle cx="26" cy="36" r="1.8" />
      <circle cx="18" cy="44" r="1.8" /><circle cx="26" cy="44" r="1.8" />
    </g>

    <!-- task name: x 32 to 320 -->
    <text x="36" y="39" fill="#e6e6e6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">write the release notes</text>

    <!-- clock: right aligned, ends at x 428 -->
    <text x="424" y="38" fill="#9aa3b2" font-family="ui-monospace, monospace" font-size="15" text-anchor="end">1:23:45</text>

    <!-- fork button, centred at x 458: a trunk with one branch peeling off -->
    <g stroke="#e6e6e6" stroke-width="3.2" stroke-linecap="round">
      <line x1="452" y1="20" x2="452" y2="44" />
      <line x1="452" y1="34" x2="466" y2="22" />
    </g>
    <g fill="#e6e6e6">
      <circle cx="452" cy="20" r="3.2" /><circle cx="452" cy="44" r="3.2" />
      <circle cx="466" cy="22" r="3.2" />
    </g>

    <!-- plus button, centred at x 514 -->
    <g stroke="#e6e6e6" stroke-width="3.2" stroke-linecap="round">
      <line x1="504" y1="32" x2="524" y2="32" />
      <line x1="514" y1="22" x2="514" y2="42" />
    </g>

    <!-- burger button, centred at x 570 -->
    <g stroke="#e6e6e6" stroke-width="3.2" stroke-linecap="round">
      <line x1="559" y1="22" x2="581" y2="22" />
      <line x1="559" y1="32" x2="581" y2="32" />
      <line x1="559" y1="42" x2="581" y2="42" />
    </g>
  </g>

  <!-- callouts: dashed leader from each part of the bar down to its label -->
  <g stroke="#7d8590" stroke-width="1.4" stroke-dasharray="3 3">
    <line x1="44" y1="84" x2="44" y2="100" />
    <line x1="480" y1="84" x2="480" y2="100" />
    <line x1="198" y1="84" x2="198" y2="128" />
    <line x1="536" y1="84" x2="536" y2="128" />
    <line x1="402" y1="84" x2="402" y2="156" />
    <line x1="592" y1="84" x2="592" y2="156" />
  </g>
  <g fill="#7d8590" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <text x="44" y="116" text-anchor="middle">drag handle</text>
    <text x="480" y="116" text-anchor="middle">task stack</text>
    <text x="198" y="144" text-anchor="middle">task name, about 4 cm</text>
    <text x="536" y="144" text-anchor="middle">new task</text>
    <text x="402" y="172" text-anchor="middle">time on this task today</text>
    <text x="592" y="172" text-anchor="middle">menu</text>
  </g>
</svg>
