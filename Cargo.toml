[package]
name = "wiptracker"
version = "0.4.0"
edition = "2024"
description = "A one-line always-on-top bar showing the task you are focused on right now"
repository = "https://github.com/paxel/wipTracker"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["productivity", "time-tracking", "egui", "desktop"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
eframe = "0.35"
egui = "0.35"
redb = "2"
rodio = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Only to ask winit for a specific backend; the version follows eframe's own.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false }

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies]
serde_json = "1"
egui_kittest = { version = "0.35", features = ["wgpu", "eframe"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
