[package]
name = "wiptracker"
version = "1.1.0"
edition = "2024"
description = "A one-line always-on-top bar showing the task you are focused on right now"
repository = "https://github.com/paxel/wipTracker"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["productivity", "time-tracking", "egui", "desktop"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
eframe = "0.35"
egui = "0.35"
notify-rust = "4.18.0"
redb = "2"
rodio = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
user-idle = { version = "0.6.0", default-features = false, features = ["x11"] }

# Only to ask winit for a specific backend; the version follows eframe's own.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false }
# Speaks the bits of EWMH winit has no API for — keeping our windows out of the
# taskbar — and asks RandR where the monitors are. Already in the tree through winit, so
# this costs no extra build.
x11rb = { version = "0.13", features = ["randr"] }

# `setsid`, which hands the terminal back when the bare binary is started from one, and
# `NSScreen`, which says where the monitors are. The objc2 crates follow winit's own.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry"] }

# `EnumDisplayMonitors`, which says where the monitors are.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies]
serde_json = "1"
egui_kittest = { version = "0.35", features = ["wgpu", "eframe"] }

# The X11 desktop integration tests read window states straight off the server.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
