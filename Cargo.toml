[package]
name = "wiptracker"
version = "1.4.0"
edition = "2024"
description = "A one-line always-on-top bar showing the task you are focused on right now"
repository = "https://github.com/paxel/wipTracker"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["productivity", "time-tracking", "egui", "desktop"]
categories = ["command-line-utilities"]

# The lint set of the standard (paxel/gates, configs/rust/lints.toml), for every target.
[lints.rust]
# Denied rather than forbidden: two platform modules need a single documented `unsafe` each
# and say so with an `#[expect(unsafe_code, reason = "...")]` of their own.
unsafe_code = "deny"

[lints.clippy]
# Shipped code may not panic: no unwrap, expect or panic, no unreachable, no indexing or
# slicing that can go out of bounds, no arithmetic that can overflow. CI runs clippy on the
# tests with these seven allowed (paxel/gates, actions/rust): they are how a test fails.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
# No `dbg!`, and no `#[allow]`: a lint that must be silenced says so with an
# `#[expect(..., reason = "...")]`, which fails once the lint no longer fires.
dbg_macro = "deny"
allow_attributes = "deny"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
eframe = "0.36"
egui = "0.36"
notify-rust = "4.18.0"
redb = "4"
# Only to convert a state file an older wipTracker wrote: redb 3 and later refuse the
# format redb 2 wrote by default, and `Database::upgrade` of redb 2.6 is the one way across.
redb2 = { package = "redb", version = "2.6" }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
user-idle = { version = "0.6.0", default-features = false, features = ["x11"] }

# Only to ask winit for a specific backend; the version follows eframe's own.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false }
# Speaks the bits of EWMH winit has no API for — keeping our windows out of the
# taskbar — and asks RandR where the monitors are.
x11rb = { version = "0.14", features = ["randr"] }

# `setsid`, which hands the terminal back when the bare binary is started from one, and
# `NSScreen`, which says where the monitors are. The objc2 crates follow winit's own.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry"] }

# `EnumDisplayMonitors`, which says where the monitors are.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies]
serde_json = "1"
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }

# The X11 desktop integration tests read window states straight off the server.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.14"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
