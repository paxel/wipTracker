# osv-scanner's exceptions, read by the OSV gate (paxel/gates vulns.yml). Each one says why
# the repository is not exposed and why no update removes it, and carries a date; when the
# date passes, the gate fails again: that is the review.
#
# An advisory:
# [[IgnoredVulns]]
# id = "RUSTSEC-2026-0000"
# ignoreUntil = 2027-05-14
# reason = "..."
#
# A licence outside the standard's allowlist (one package):
# [[PackageOverrides]]
# name = "some-crate"
# ecosystem = "crates.io"
# license.ignore = true
# effectiveUntil = 2027-05-14
# reason = "..."
#
# CI and the release list a notice that a crate is unmaintained without failing; the weekly
# Security run fails on it.

[[IgnoredVulns]]
id = "RUSTSEC-2020-0168"
ignoreUntil = 2027-05-14
reason = """mach is unmaintained; no vulnerability is described. Both versions come only \
through user-idle 0.6, which reads the macOS idle time with them. user-idle has no \
release without mach; the idle probe is a thin adapter and can move off it when one \
appears."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
ignoreUntil = 2027-05-14
reason = """ttf-parser is unmaintained; no vulnerability is described. It comes only \
through eframe -> winit 0.30 -> sctk-adwaita 0.10 -> ab_glyph, which draws the window \
title bar on Wayland desktops without server-side decorations. The font it parses is \
the system title-bar font or sctk-adwaita's embedded Cantarell, never a user file."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
ignoreUntil = 2027-05-14
reason = """zbus_names is unmaintained because it moved into zbus 6; no vulnerability is \
described. It is part of zbus 5, which egui's accessibility (accesskit_unix, atspi) uses \
to talk to the user's own session bus. It stays until egui's accessibility moves to \
zbus 6."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = 2027-05-14
reason = """zvariant is unmaintained because it moved into zbus 6; no vulnerability is \
described. Same as RUSTSEC-2026-0371: part of zbus 5, used by egui's accessibility on \
the session bus."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
ignoreUntil = 2027-05-14
reason = """zvariant_derive is unmaintained because it moved into zbus 6; no \
vulnerability is described. A proc macro of zbus 5, run at compile time only. Same as \
RUSTSEC-2026-0371."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-02-14
reason = """chrono is unmaintained; no vulnerability is described and no fixed release exists. \
wipTracker computes every time with it and stores dates and times in its format, so it \
cannot go with an update: replacing it (jiff is the named successor) changes the code in \
18 files and has to keep reading the state files people already have."""
